<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CropSense SVM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f5c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a phone app column (max 480px) with a field-landscape header, screens switched by a bottom tab bar,
   and a live "best crop" bar that stays above the tabs while you edit values. */
:root {
  --bg: #eef3ec;
  --surface: #ffffff;
  --ink: #17241b;
  --muted: #5b6b60;
  --line: #d6dfd3;
  --leaf: #1f6b40;
  --leaf-deep: #154a2d;
  --leaf-soft: #dcefe2;
  --sun: #f2b632;
  --soil: #9a5b2e;
  --track: #e3eae0;
  --warn: #b4610f;
  --warn-soft: #fbeedd;
  --t-cereal: #d99a1e; --t-pulse: #9a5b2e; --t-fruit: #d2483f; --t-fibre: #4d7fa8; --t-plantation: #2f8a57;
  --sky1: #bfe3f2; --sky2: #e9f6ea; --hill1: #7fbf6a; --hill2: #3f8f4f; --field: #6b4a2b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", "Noto Sans Telugu", "Noto Sans Devanagari", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #17211b; --ink: #e5ece6; --muted: #98a89d; --line: #29362e;
    --leaf: #63c18a; --leaf-deep: #0f2d1c; --leaf-soft: #1b3324; --sun: #f2c14e; --soil: #d08a55;
    --track: #24302a; --warn: #f0a050; --warn-soft: #3a2a17;
    --sky1: #1d3a4a; --sky2: #183026; --hill1: #2e6b3c; --hill2: #1f4f2c; --field: #3e2c1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #17211b; --ink: #e5ece6; --muted: #98a89d; --line: #29362e;
  --leaf: #63c18a; --leaf-deep: #0f2d1c; --leaf-soft: #1b3324; --sun: #f2c14e; --soil: #d08a55;
  --track: #24302a; --warn: #f0a050; --warn-soft: #3a2a17;
  --sky1: #1d3a4a; --sky2: #183026; --hill1: #2e6b3c; --hill2: #1f4f2c; --field: #3e2c1b;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

/* header */
.hero { position: relative; overflow: hidden; }
.hero svg.scene { display: block; width: 100%; height: 150px; }
.hero .top { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding-block: 14px 12px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; margin: 0; letter-spacing: -0.02em; color: var(--leaf-deep); }
:root[data-theme="dark"] .brand h1 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand h1 { color: var(--ink); } }
.brand h1 span { color: var(--leaf); }
.lang { display: flex; background: var(--surface); border-radius: 999px; padding: 3px; gap: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--leaf); color: var(--surface); }
.tagline { margin: 0; font-weight: 600; font-size: 14px; color: var(--surface); text-shadow: 0 1px 3px rgba(0,0,0,.45); }

/* screens */
.screen { display: flex; flex-direction: column; gap: 14px; padding-block: 14px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; margin: 0; text-wrap: balance; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; border: 1px solid var(--line); }

.presets { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.presets::-webkit-scrollbar { display: none; }
.presets button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; cursor: pointer; }
.presets button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }

.inputs { display: grid; gap: 4px; }
.inp { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; }
.inp + .inp { border-top: 1px solid var(--line); }
.ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; color: #fff; grid-row: 1 / 3; }
.inp .nm { font-weight: 600; font-size: 14px; }
.inp .nm small { color: var(--muted); font-weight: 400; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; cursor: pointer; }
.step input { width: 64px; text-align: center; font-family: var(--font-num); font-size: 15px; padding: 6px 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.inp input[type="range"] { grid-column: 2 / 4; width: 100%; margin: 0; accent-color: var(--leaf); height: 22px; }

/* live result bar */
.peek { position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 5; pointer-events: none; }
.peek .in { max-width: 480px; margin: 0 auto; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.peek button { pointer-events: auto; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; border-radius: 18px; padding: 10px 14px; background: var(--leaf-deep); color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
.peek .b { width: 42px; height: 42px; font-size: 22px; flex: 0 0 auto; }
.peek .t { flex: 1; min-width: 0; }
.peek .t small { display: block; opacity: .75; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.peek .t strong { font-family: var(--font-display); font-size: 1.25rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peek .go { font-size: 13px; font-weight: 600; background: var(--sun); color: #2a1d00; border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.peek .pc { font-family: var(--font-num); font-size: 13px; opacity: .85; }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs button { border: 0; background: transparent; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
nav.tabs svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--leaf); font-weight: 600; }

/* badges */
.b { border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: #fff; }
.b.cereal { background: var(--t-cereal); } .b.pulse { background: var(--t-pulse); } .b.fruit { background: var(--t-fruit); }
.b.fibre { background: var(--t-fibre); } .b.plantation { background: var(--t-plantation); }

/* result */
.backbar { display: flex; align-items: center; gap: 8px; }
.backbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 10px; cursor: pointer; font-size: 14px; }
.winner { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 14px; align-items: center; background: linear-gradient(160deg, var(--leaf-deep), var(--leaf)); color: #fff; border: 0; }
.winner .b { width: 72px; height: 72px; font-size: 36px; border-radius: 20px; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.winner small { display: block; opacity: .8; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.winner .name { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1.05; overflow-wrap: anywhere; }
.winner .en { opacity: .8; font-size: 13px; text-transform: capitalize; }
.ring { position: relative; width: 72px; height: 72px; }
.ring svg { width: 72px; height: 72px; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-num); font-size: 14px; }
.warnline { grid-column: 1 / -1; background: rgba(0,0,0,.18); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.fact b { display: block; font-size: 14px; margin-top: 2px; }
.tips { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.tips li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px; border-radius: 12px; background: var(--warn-soft); font-size: 14px; }
.tips li.ok { background: var(--leaf-soft); }
.tips li i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--warn); color: #fff; font-weight: 700; font-size: 14px; }
.tips li.ok i { background: var(--leaf); }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-top: 10px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 132px; border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.mini .b { width: 40px; height: 40px; font-size: 20px; }
.mini strong { font-size: 14px; }
.fit { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; align-self: flex-start; }
.fit.s { background: var(--leaf-soft); color: var(--leaf); }
.fit.p { background: var(--warn-soft); color: var(--warn); }
.bars { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) 56px; gap: 4px 10px; font-size: 14px; }
.bars .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bars .bar i { display: block; height: 100%; background: var(--leaf); border-radius: 4px; }
.bars .pct { text-align: right; font-family: var(--font-num); font-size: 13px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 13px; font-weight: 600; cursor: pointer; font-size: 15px; }
.btn.pri { background: var(--leaf); color: var(--surface); }
.btn.sec { background: var(--surface); border: 1px solid var(--line); }

/* crops */
.search { width: 100%; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.cropgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cropcard { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; cursor: pointer; }
.cropcard .b { width: 44px; height: 44px; font-size: 22px; }
.cropcard strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
.cropcard small { color: var(--muted); font-size: 12px; }
.ranges { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.ranges td { padding: 8px 2px; border-bottom: 1px solid var(--line); }
.ranges td:last-child { text-align: right; font-family: var(--font-num); font-size: 13px; }
.dhead { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.dhead .b { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
.dhead .name { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; }
.dhead .en { color: var(--muted); text-transform: capitalize; font-size: 13px; }

/* history */
.hist { display: grid; gap: 10px; }
.hitem { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.hitem .b { width: 44px; height: 44px; font-size: 22px; }
.hitem strong { display: block; }
.hitem small { color: var(--muted); font-size: 12px; display: block; }
.hitem .ops { display: flex; gap: 6px; }
.hitem .ops button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 6px 0 0; }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 10; }
@media (prefers-reduced-motion: no-preference) { .screen { animation: in .18s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
</style>

<div class="app">
  <header class="hero">
    <svg class="scene" viewBox="0 0 480 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient></defs>
      <rect width="480" height="150" fill="url(#sky)"/>
      <circle cx="300" cy="52" r="20" fill="var(--sun)"/>
      <path d="M0 98 C90 70 170 74 250 92 C330 110 400 78 480 86 V150 H0Z" fill="var(--hill1)"/>
      <path d="M0 118 C120 100 220 104 300 114 C380 124 430 108 480 110 V150 H0Z" fill="var(--hill2)"/>
      <path d="M0 132 H480 V150 H0Z" fill="var(--field)"/>
      <g stroke="var(--hill1)" stroke-width="3" stroke-linecap="round">
        <path d="M20 132 v-8 M44 132 v-10 M68 132 v-8 M92 132 v-10 M116 132 v-8 M140 132 v-10 M164 132 v-8 M188 132 v-10 M212 132 v-8 M236 132 v-10 M260 132 v-8 M284 132 v-10 M308 132 v-8 M332 132 v-10 M356 132 v-8 M380 132 v-10 M404 132 v-8 M428 132 v-10 M452 132 v-8"/>
      </g>
    </svg>
    <div class="top pad">
      <div class="brand">
        <h1>Crop<span>Sense</span></h1>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="lang-en" data-l="en">EN</button>
          <button type="button" id="lang-te" data-l="te">తె</button>
          <button type="button" id="lang-hi" data-l="hi">हि</button>
        </div>
      </div>
      <p class="tagline" data-t="tagline"></p>
    </div>
  </header>

  <!-- RECOMMEND -->
  <section class="screen pad" id="scr-home">
    <div>
      <div class="label" data-t="examples"></div>
      <div class="presets" id="presets" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2 data-t="soil"></h2>
      <div class="inputs" id="in-soil"></div>
    </div>
    <div class="card">
      <h2 data-t="weather"></h2>
      <div class="inputs" id="in-weather"></div>
    </div>
    <p class="foot" data-t="footer"></p>
    <p class="foot" id="aboutLine"></p>
  </section>

  <!-- RESULT -->
  <section class="screen pad" id="scr-result" hidden>
    <div class="backbar"><button type="button" id="backHome">‹ <span data-t="editField"></span></button></div>
    <div class="card winner" id="winner"></div>
    <div class="facts" id="facts"></div>
    <div class="card">
      <h2 data-t="improve"></h2>
      <ul class="tips" id="tips"></ul>
      <p class="note" data-t="rough"></p>
    </div>
    <div class="card">
      <h2 data-t="alsoSuit"></h2>
      <div class="hscroll" id="others"></div>
    </div>
    <div class="card">
      <h2 data-t="svmTop"></h2>
      <ul class="bars" id="bars"></ul>
    </div>
    <div class="actions">
      <button type="button" class="btn sec" id="btnShare" data-t="share"></button>
      <button type="button" class="btn pri" id="btnSave" data-t="save"></button>
    </div>
  </section>

  <!-- CROPS -->
  <section class="screen pad" id="scr-crops" hidden>
    <h2 data-t="crops22"></h2>
    <input class="search" id="cropSearch" type="search" autocomplete="off">
    <div class="cropgrid" id="cropGrid"></div>
  </section>

  <!-- CROP DETAIL -->
  <section class="screen pad" id="scr-crop" hidden>
    <div class="backbar"><button type="button" id="backCrops">‹ <span data-t="tabCrops"></span></button></div>
    <div class="card"><div class="dhead" id="dHead"></div></div>
    <div class="facts" id="dFacts"></div>
    <div class="card">
      <h2 data-t="idealRanges"></h2>
      <table class="ranges" id="dRanges"></table>
    </div>
    <button type="button" class="btn pri" id="dUse" data-t="useTypical"></button>
  </section>

  <!-- HISTORY -->
  <section class="screen pad" id="scr-history" hidden>
    <h2 data-t="tabHistory"></h2>
    <div class="hist" id="histList"></div>
  </section>
</div>

<div class="peek" id="peek"><div class="in"><button type="button" id="peekBtn"></button></div></div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" id="tab-home" data-go="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11C12 6 8 3 3 3c0 5 4 8 9 8z"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/></svg>
      <span data-t="tabHome"></span>
    </button>
    <button type="button" id="tab-crops" data-go="crops">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      <span data-t="tabCrops"></span>
    </button>
    <button type="button" id="tab-history" data-go="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-t="tabHistory"></span>
    </button>
  </div>

  const $ = id => document.getElementById(id);
  const t = k => (T[lang][k] !== undefined ? T[lang][k] : T.en[k]);
  const fmtS = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m));
  const cname = c => (lang === 'en' ? c.charAt(0).toUpperCase() + c.slice(1).replace('beans', ' beans').replace('peas', ' peas').replace('gram', ' gram') : CROP[c][lang]);
  const enName = c => c.replace('beans', ' beans').replace('peas', ' peas').replace('gram', ' gram');
  const badge = (c, cls) => '<span class="b ' + CROP[c].type + ' ' + (cls || '') + '" aria-hidden="true">' + (CROP[c].icon || cname(c).charAt(0)) + '</span>';
  const durText = c => { const d = CROP[c].dur; return fmtS(T[lang].dur[d[0]], { a: d[1], b: d[2] }); };
  const seasonText = c => CROP[c].season.map(s => T[lang].seasons[s]).join(' · ');
  const nice = v => (Math.abs(v) >= 10 ? Math.round(v).toString() : (+v.toFixed(1)).toString());
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 1800); }

  // ---------- inputs ----------
  const inputs = {};
  META.forEach(m => {
    const row = document.createElement('div');
    row.className = 'inp';
    row.innerHTML =
      '<span class="ico" style="background:' + m.color + '">' + m.ab + '</span>' +
      '<label class="nm" for="n_' + m.key + '"></label>' +
      '<span class="step"><button type="button" aria-label="minus">−</button>' +
      '<input type="number" id="n_' + m.key + '" inputmode="decimal" min="' + m.min + '" max="' + m.max + '" step="' + m.step + '">' +
      '<button type="button" aria-label="plus">+</button></span>' +
      '<input type="range" id="r_' + m.key + '" min="' + m.min + '" max="' + m.max + '" step="' + m.step + '">';
    $('in-' + m.group).appendChild(row);
    const num = row.querySelector('input[type=number]'), rng = row.querySelector('input[type=range]');
    const [minus, plus] = row.querySelectorAll('.step button');
    inputs[m.key] = { num, rng, label: row.querySelector('label'), m };
    const setV = v => {
      v = Math.min(m.max, Math.max(m.min, v));
      v = Math.round(v / m.step) * m.step; v = +v.toFixed(2);
      state[m.key] = v; num.value = v; rng.value = v; presetIdx = -1; markPreset(); update();
    };
    num.addEventListener('change', () => { const v = parseFloat(num.value); if (!isNaN(v)) setV(v); else num.value = state[m.key]; });
    num.addEventListener('input', () => { const v = parseFloat(num.value); if (!isNaN(v) && v >= m.min && v <= m.max) { state[m.key] = v; rng.value = v; presetIdx = -1; markPreset(); update(); } });
    rng.addEventListener('input', () => setV(parseFloat(rng.value)));
    minus.addEventListener('click', () => setV(state[m.key] - m.step * (m.step < 1 ? 1 : (m.max - m.min > 150 ? 5 : 1))));
    plus.addEventListener('click', () => setV(state[m.key] + m.step * (m.step < 1 ? 1 : (m.max - m.min > 150 ? 5 : 1))));
  });
  function syncInputs() { META.forEach(m => { inputs[m.key].num.value = state[m.key]; inputs[m.key].rng.value = state[m.key]; }); }

  const presetBox = $('presets');
  PRESETS.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.id = 'preset' + i;
    b.addEventListener('click', () => { Object.assign(state, p); presetIdx = i; syncInputs(); markPreset(); update(); });
    presetBox.appendChild(b);
  });
  function markPreset() { presetBox.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === presetIdx ? 'true' : 'false')); }

  // ---------- compute ----------
  function compute(vals) {
    const raw = M.features.map(f => vals[f]);
    const p = predict(raw);
    const order = p.map((v, i) => i).sort((a, b) => p[b] - p[a]);
    const s = conditionMatch(raw);
    return { vals: Object.assign({}, vals), raw, p, order, s, best: M.crops[order[0]], conf: p[order[0]] };
  }
  function update() {
    current = compute(state);
    store.set('field', state);
    const c = current.best;
    $('peekBtn').innerHTML = badge(c) +
      '<span class="t"><small>' + t('best') + '</small><strong>' + cname(c) + '</strong></span>' +
      '<span class="pc">' + Math.round(current.conf * 100) + '%</span><span class="go">' + t('seeAdvice') + ' ›</span>';
    if (!$('scr-result').hidden) renderResult();
  }

  // ---------- advice ----------
  function tips(c, v) {
    const R = RANGES[c], prof = M.profile[M.crops.indexOf(c)], out = [];
    const L = T[lang].tips, F = T[lang].feat;
    const r5 = x => Math.max(5, Math.round(x / 5) * 5);
    const chk = (key, low, fert) => {
      const j = fi(key), val = v[key];
      if (val < R[j][0]) out.push(fmtS(L[low], { x: r5((prof[j] - val) / fert) }));
      else if (val > R[j][1]) out.push(fmtS(L.high, { f: F[key] }));
    };
    chk('N', 'nLow', 0.46); chk('P', 'pLow', 0.46); chk('K', 'kLow', 0.60);
    const jp = fi('ph');
    if (v.ph < R[jp][0]) out.push(L.phLow); else if (v.ph > R[jp][1]) out.push(L.phHigh);
    const jr = fi('rainfall');
    if (v.rainfall < R[jr][0]) out.push(fmtS(L.rainLow, { x: r5(R[jr][0] - v.rainfall) }));
    else if (v.rainfall > R[jr][1]) out.push(fmtS(L.rainHigh, { x: r5(v.rainfall - R[jr][1]) }));
    const jt = fi('temperature'), jh = fi('humidity');
    if (v.temperature < R[jt][0] || v.temperature > R[jt][1]) out.push(fmtS(L.tempOut, { a: nice(R[jt][0]), b: nice(R[jt][1]) }));
    if (v.humidity < R[jh][0] || v.humidity > R[jh][1]) out.push(fmtS(L.humOut, { a: nice(R[jh][0]), b: nice(R[jh][1]) }));
    return out;
  }
  function inRangeCount(c, raw) { return RANGES[c].filter((r, j) => raw[j] >= r[0] && raw[j] <= r[1]).length; }

  function factsHtml(c) {
    return [[t('season'), seasonText(c)], [t('duration'), durText(c)], [t('water'), T[lang].waterL[CROP[c].water]], [t('type'), T[lang].types[CROP[c].type]]]
      .map(f => '<div class="fact"><span class="label">' + f[0] + '</span><b>' + f[1] + '</b></div>').join('');
  }

  function renderResult() {
    const r = current, c = r.best, pc = Math.round(r.conf * 100), C = 2 * Math.PI * 30;
    $('winner').innerHTML = badge(c) +
      '<div><small>' + t('best') + '</small><div class="name">' + cname(c) + '</div>' +
      (lang !== 'en' ? '<div class="en">' + enName(c) + '</div>' : '') +
      '<div class="en" style="text-transform:none">' + fmtS(t('match'), { n: inRangeCount(c, r.raw) }) + '</div></div>' +
      '<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>' +
      '<circle cx="36" cy="36" r="30" fill="none" stroke="var(--sun)" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (C * r.conf).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
      '<span>' + pc + '%</span></div>' +
      (pc < 70 ? '<div class="warnline">' + t('mixed') + '</div>' : '');
    $('facts').innerHTML = factsHtml(c);
    const tp = tips(c, r.vals);
    $('tips').innerHTML = tp.length ? tp.map(x => '<li><i>!</i><span>' + x + '</span></li>').join('')
      : '<li class="ok"><i>✓</i><span>' + T[lang].tips.allGood + '</span></li>';
    const others = r.s.map((v, i) => i).filter(i => M.crops[i] !== c && r.s[i] >= 0.3).sort((a, b) => r.s[b] - r.s[a]);
    $('others').innerHTML = others.length ? others.map(i => {
      const oc = M.crops[i], good = r.s[i] >= 0.7;
      return '<button type="button" class="mini" data-crop="' + oc + '">' + badge(oc) + '<strong>' + cname(oc) + '</strong>' +
        '<span class="fit ' + (good ? 's' : 'p') + '">' + (good ? t('good') : t('possible')) + ' · ' + Math.round(r.s[i] * 100) + '%</span></button>';
    }).join('') : '<p class="note" style="margin:0">' + t('noOther') + '</p>';
    $('bars').innerHTML = r.order.slice(0, 3).map(k =>
      '<li><span>' + cname(M.crops[k]) + '</span><span class="pct">' + (r.p[k] * 100).toFixed(1) + '%</span>' +
      '<span class="bar"><i style="width:' + Math.max(1, r.p[k] * 100).toFixed(1) + '%"></i></span></li>').join('');
  }
  $('others').addEventListener('click', e => { const b = e.target.closest('[data-crop]'); if (b) openCrop(b.dataset.crop, 'result'); });

  // ---------- crops ----------
  function renderCrops() {
    const q = ($('cropSearch').value || '').trim().toLowerCase();
    const list = M.crops.filter(c => !q || c.includes(q) || CROP[c].te.includes(q) || CROP[c].hi.includes(q) || cname(c).toLowerCase().includes(q))
      .sort((a, b) => cname(a).localeCompare(cname(b)));
    $('cropGrid').innerHTML = list.map(c => '<button type="button" class="cropcard" data-crop="' + c + '">' + badge(c) +
      '<span><strong>' + cname(c) + '</strong><small>' + T[lang].types[CROP[c].type] + ' · ' + T[lang].seasons[CROP[c].season[0]] + '</small></span></button>').join('');
  }
  $('cropSearch').addEventListener('input', renderCrops);
  $('cropGrid').addEventListener('click', e => { const b = e.target.closest('[data-crop]'); if (b) openCrop(b.dataset.crop, 'crops'); });
  let cropBack = 'crops', openC = null;
  function openCrop(c, from) {
    openC = c; cropBack = from;
    $('dHead').innerHTML = badge(c) + '<div><div class="name">' + cname(c) + '</div>' + (lang !== 'en' ? '<div class="en">' + enName(c) + '</div>' : '') + '</div>';
    $('dFacts').innerHTML = factsHtml(c);
    $('dRanges').innerHTML = META.map(m => { const r = RANGES[c][fi(m.key)];
      return '<tr><td>' + T[lang].feat[m.key] + '</td><td>' + nice(r[0]) + ' – ' + nice(r[1]) + (m.unit ? ' ' + m.unit : '') + '</td></tr>'; }).join('');
    $('backCrops').querySelector('span').textContent = from === 'result' ? t('best') : t('tabCrops');
    show('crop');
  }
  $('dUse').addEventListener('click', () => {
    const prof = M.profile[M.crops.indexOf(openC)];
    META.forEach(m => { state[m.key] = +(+prof[fi(m.key)]).toFixed(m.step < 1 ? 1 : 0); });
    presetIdx = -1; syncInputs(); markPreset(); update(); show('home');
  });
  $('backCrops').addEventListener('click', () => show(cropBack === 'result' ? 'result' : 'crops'));

  // ---------- history ----------
  function renderHistory() {
    const h = store.get('history', []);
    $('histList').innerHTML = h.length ? h.map((e, i) => {
      const d = new Date(e.at);
      return '<div class="card hitem">' + badge(e.best) + '<div style="min-width:0"><strong>' + cname(e.best) + ' · ' + e.conf + '%</strong>' +
        '<small>' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</small>' +
        '<small>N ' + e.v.N + ' · P ' + e.v.P + ' · K ' + e.v.K + ' · pH ' + e.v.ph + ' · ' + e.v.rainfall + ' mm</small></div>' +
        '<div class="ops"><button type="button" data-open="' + i + '">' + t('open') + '</button><button type="button" data-del="' + i + '" aria-label="' + t('del') + '">✕</button></div></div>';
    }).join('') : '<div class="empty">' + t('histEmpty') + '</div>';
  }
  $('histList').addEventListener('click', e => {
    const h = store.get('history', []);
    const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
    if (o) { Object.assign(state, h[+o.dataset.open].v); presetIdx = -1; syncInputs(); markPreset(); update(); show('result'); }
    if (d) { h.splice(+d.dataset.del, 1); store.set('history', h); renderHistory(); toast(t('deleted')); }
  });
  $('btnSave').addEventListener('click', () => {
    const h = store.get('history', []);
    h.unshift({ at: Date.now(), v: Object.assign({}, state), best: current.best, conf: Math.round(current.conf * 100) });
    store.set('history', h.slice(0, 40)); toast(t('saved'));
  });

  // ---------- share ----------
  $('btnShare').addEventListener('click', () => {
    const r = current, v = r.vals;
    const others = r.s.map((x, i) => i).filter(i => M.crops[i] !== r.best && r.s[i] >= 0.3).map(i => cname(M.crops[i]));
    const text = 'CropSense: ' + t('best') + ' = ' + cname(r.best) + ' (' + Math.round(r.conf * 100) + '%)\n' +
      'N ' + v.N + ', P ' + v.P + ', K ' + v.K + ', pH ' + v.ph + ', ' + v.temperature + ' °C, ' + v.humidity + '%, ' + v.rainfall + ' mm\n' +
      (others.length ? t('alsoSuit') + ': ' + others.join(', ') + '\n' : '') +
      'https://mallikarjunreddy8.github.io/cropsense/';
    if (window.AndroidBridge && window.AndroidBridge.share) { window.AndroidBridge.share(text); return; }
    if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast(t('copied')), () => toast(text.split('\n')[0]));
    else toast(text.split('\n')[0]);
  });

  // ---------- navigation ----------
  const SCREENS = ['home', 'result', 'crops', 'crop', 'history'];
  function show(name) {
    SCREENS.forEach(s => { $('scr-' + s).hidden = s !== name; });
    const tab = name === 'result' ? 'home' : (name === 'crop' ? 'crops' : name);
    document.querySelectorAll('nav.tabs button').forEach(b => { if (b.dataset.go === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('peek').hidden = name !== 'home';
    if (name === 'result') renderResult();
    if (name === 'crops') renderCrops();
    if (name === 'history') renderHistory();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
  $('peekBtn').addEventListener('click', () => show('result'));
  $('backHome').addEventListener('click', () => show('home'));

  // ---------- language ----------
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang ? 'true' : 'false'));
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    META.forEach(m => { inputs[m.key].label.innerHTML = T[lang].feat[m.key] + (m.unit ? ' <small>' + m.unit + '</small>' : ''); });
    presetBox.querySelectorAll('button').forEach((b, i) => { b.textContent = T[lang].presets[i]; });
    $('cropSearch').placeholder = t('search');
    $('aboutLine').textContent = 'RBF SVM · C=' + M.C + ', γ=' + M.gamma + ' · 99.32% test accuracy · v' + APP_VERSION;
    update();
    const vis = SCREENS.find(s => !$('scr-' + s).hidden);
    if (vis === 'crops') renderCrops(); if (vis === 'history') renderHistory(); if (vis === 'crop' && openC) openCrop(openC, cropBack);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; store.set('lang', lang); applyLang(); }));

  syncInputs(); markPreset(); applyLang(); show('home');
})();
</script>
